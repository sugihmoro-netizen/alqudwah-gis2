<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Background with rounded rectangle for safe area -->
  <rect width="512" height="512" rx="100" fill="url(#grad)" />
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8" />
  
  <!-- School / Student ID Badge & Attendance Check Icon -->
  <!-- ID Card / Clipboard base -->
  <rect x="136" y="110" width="240" height="300" rx="28" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.25))" />
  
  <!-- Clipboard clip at top -->
  <rect x="206" y="90" width="100" height="36" rx="10" fill="#0f172a" />
  <circle cx="256" cy="108" r="8" fill="#ffffff" />
  
  <!-- Student Silhouette / Avatar -->
  <circle cx="256" cy="190" r="38" fill="#2563eb" />
  <path d="M196 268 C196 236 216 226 256 226 C296 226 316 236 316 268 Z" fill="#2563eb" />
  
  <!-- Attendance rows / checklist indicators -->
  <rect x="176" y="295" width="100" height="12" rx="6" fill="#94a3b8" />
  <circle cx="320" cy="301" r="10" fill="#10b981" />
  
  <rect x="176" y="325" width="115" height="12" rx="6" fill="#cbd5e1" />
  <circle cx="320" cy="331" r="10" fill="#10b981" />
  
  <rect x="176" y="355" width="80" height="12" rx="6" fill="#cbd5e1" />
  <circle cx="320" cy="361" r="10" fill="#3b82f6" />
  
  <!-- Green Success Checkmark Badge floating at bottom right -->
  <circle cx="360" cy="380" r="44" fill="#10b981" stroke="#ffffff" stroke-width="6" />
  <path d="M342 380 L354 392 L378 368" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
